<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <meta property="og:title" content="Hamzeh Abdallah" />
    <meta property="og:description" content="<%= productDescription %>" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hamzehab.github.io/portfolio/" />
    <meta
      property="og:image"
      content="https://hamzehab.github.io/portfolio/static/images/portrait.jpg"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hamzeh Abdallah" />
    <meta name="twitter:description" content="<%= productDescription %>" />
    <meta
      name="twitter:image"
      content="https://hamzehab.github.io/portfolio/static/images/portrait.jpg"
    />

    <link
      rel="icon"
      type="image/ico"
      href="static/favicon.ico"
      style="border-radius: 50px"
    />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
